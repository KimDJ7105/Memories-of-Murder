<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>살인의 추억</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --paper: #ece2c6;
    --paper-dark: #ddcfa6;
    --ink: #2b2116;
    --ink-faded: #5a4d38;
    --rule: #8a7a55;
    --accent: #7a1f1f;
  }

  body {
    font-family: Georgia, "Times New Roman", serif;
    max-width: 760px;
    margin: 24px auto;
    padding: 0 16px 60px;
    color: var(--ink);
    background:
      radial-gradient(ellipse at 15% 20%, rgba(120,90,40,0.10), transparent 40%),
      radial-gradient(ellipse at 85% 70%, rgba(120,90,40,0.12), transparent 45%),
      radial-gradient(ellipse at 60% 10%, rgba(80,60,20,0.08), transparent 35%),
      var(--paper);
  }

  h1.masthead {
    text-align: center;
    font-size: 2.4em;
    letter-spacing: 6px;
    margin: 8px 0 4px;
    text-transform: uppercase;
    border-top: 4px double var(--ink);
    border-bottom: 4px double var(--ink);
    padding: 10px 0;
  }
  .subhead { text-align: center; font-style: italic; color: var(--ink-faded); margin: 0 0 20px; font-size: 0.9em; }

  section {
    border: 1px solid var(--rule);
    background: rgba(255, 252, 240, 0.35);
    padding: 16px;
    margin-bottom: 18px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.04) inset;
  }
  h2 {
    margin-top: 0;
    font-size: 1.1em;
    text-transform: uppercase;
    letter-spacing: 2px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 6px;
  }

  #connection { font-size: 0.8em; color: var(--ink-faded); margin-bottom: 12px; text-align: right; }
  #connection.ok::before { content: "● "; color: #3a6b35; }
  #connection.bad::before { content: "● "; color: var(--accent); }

  input[type=text], textarea {
    width: 100%; padding: 8px; font-size: 1em; font-family: inherit;
    border: 1px solid var(--rule); background: #fbf6e6; color: var(--ink); border-radius: 2px;
  }
  textarea { min-height: 90px; resize: vertical; }

  button {
    padding: 8px 18px; font-size: 0.95em; font-family: inherit; border: 1px solid var(--ink);
    border-radius: 2px; background: var(--ink); color: var(--paper); cursor: pointer; margin-top: 8px;
    text-transform: uppercase; letter-spacing: 1px;
  }
  button:hover { background: #46392a; }
  button:disabled { background: #a99; border-color: #a99; cursor: not-allowed; }

  ul#players, ul#players-round { list-style: none; padding: 0; margin: 0; }
  ul#players li, ul#players-round li {
    padding: 5px 2px; border-bottom: 1px dotted var(--rule);
    display: flex; justify-content: space-between; font-size: 0.95em;
  }
  .badge { font-size: 0.7em; padding: 2px 6px; border: 1px solid var(--ink); margin-left: 6px; }
  .badge.host { background: #d8b34a; }
  .badge.turn { background: var(--accent); color: #fff; border-color: var(--accent); }
  .badge.watch { color: var(--accent); border-color: var(--accent); background: transparent; }

  .score-breakdown { list-style: none; padding: 0; margin: 8px 0 16px; }
  .score-breakdown li { margin-bottom: 7px; }
  .score-breakdown .cat-row { display: flex; justify-content: space-between; font-size: 0.85em; margin-bottom: 3px; }
  .score-breakdown .cat-track { background: var(--paper-dark); border: 1px solid var(--rule); height: 8px; }
  .score-breakdown .cat-fill { background: var(--accent); height: 100%; }

  .role-banner { font-weight: bold; padding: 8px 12px; margin-bottom: 12px; border: 2px solid var(--ink); text-align: center; }
  .role-banner.criminal { background: #e5c9c9; }
  .role-banner.detective { background: #c9d3e5; }

  #map-wrap, #weapon-list-wrap { margin-bottom: 14px; font-size: 0.9em; }
  #map-wrap .map-name, #weapon-list-wrap .weapon-list-name { font-weight: bold; margin-bottom: 6px; }
  #map-wrap ul, #weapon-list-wrap ul { list-style: none; padding: 0; margin: 0; }
  #map-wrap li { padding: 2px 0; }
  #map-wrap .room-name { font-weight: bold; }
  #map-wrap .room-links { color: var(--ink-faded); }
  #weapon-list-wrap ul { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  #map-image { display: block; max-width: 100%; margin: 8px 0; border: 1px solid var(--rule); }
  #map-picker-wrap { margin: 10px 0; }

  #room-code-display {
    font-size: 1.3em; font-weight: bold; text-align: center; letter-spacing: 4px;
    padding: 10px; border: 2px dashed var(--rule); background: rgba(216,179,74,0.15);
  }

  #score-preview {
    font-weight: bold; text-align: center; padding: 8px; margin-bottom: 12px;
    border: 2px dashed var(--rule); background: rgba(216,179,74,0.15);
  }

  .loading-box { text-align: center; font-style: italic; color: var(--ink-faded); padding: 10px; }
  .loading-box .spinner { display: inline-block; animation: loading-pulse 1s ease-in-out infinite; }
  @keyframes loading-pulse {
    0%, 100% { opacity: 0.3; } 50% { opacity: 1; }
  }

  #investigation-log { margin-top: 10px; }
  .log-entry { border-left: 3px solid var(--rule); padding: 6px 10px; margin-bottom: 8px; background: rgba(255,252,240,0.5); }
  .log-entry.correct { border-left-color: #3a6b35; }
  .log-entry .who { font-weight: bold; }
  .aspects { font-size: 0.85em; color: var(--ink-faded); margin-top: 4px; }
  .aspects span { margin-right: 10px; }

  #turn-banner { font-style: italic; margin-bottom: 8px; }
  #advance-box { margin-top: 8px; font-size: 0.9em; }
  #advance-hint, #next-round-hint { color: var(--ink-faded); font-style: italic; }

  .phase-timer { font-weight: bold; margin: 4px 0 8px; }
  .phase-timer.warn { color: var(--accent); }

  #criminal-answer-panel {
    margin: 10px 0 14px; padding: 10px; border: 2px dashed var(--accent); background: rgba(122,31,31,0.06);
  }
  #criminal-answer-panel h3 { margin: 0 0 8px; font-size: 0.95em; }
  #criminal-answer-key { list-style: none; padding: 0; margin: 8px 0 0; font-size: 0.9em; }
  #criminal-answer-key li { padding: 2px 0; }

  .error { color: var(--accent); font-weight: bold; }
  #log { background: rgba(0,0,0,0.03); border: 1px solid var(--rule); padding: 8px; font-size: 0.75em; max-height: 140px; overflow-y: auto; white-space: pre-wrap; font-family: "Consolas", monospace; }
</style>
</head>
<body>
<h1 class="masthead">살인의 추억</h1>
<p class="subhead">— 사건 현장 속보 —</p>
<div id="connection" class="bad">연결 중...</div>

<section id="join-screen">
  <h2>입장</h2>
  <input id="name-input" type="text" placeholder="닉네임">
  <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start;">
    <div>
      <button id="create-room-btn">새 방 만들기</button>
    </div>
    <div>
      <input id="room-code-input" type="text" placeholder="방 코드 (4자리)" maxlength="4" style="width:120px; display:inline-block;">
      <button id="join-room-btn">방 코드로 입장</button>
    </div>
  </div>
</section>

<section id="lobby-screen" hidden>
  <h2>대기실</h2>
  <p id="room-code-display"></p>
  <ul id="players"></ul>

  <div id="map-picker-wrap">
    <label for="map-picker">지도: </label>
    <select id="map-picker"></select>
    <span id="map-picker-readonly" hidden></span>
  </div>

  <button id="start-btn" hidden>게임 시작 (3~6명 필요)</button>
  <p id="lobby-hint"></p>
</section>

<section id="round-screen" hidden>
  <h2 id="round-title"></h2>

  <div id="map-wrap">
    <p class="map-name" id="map-name"></p>
    <img id="map-image" hidden alt="지도 이미지">
    <ul id="map-rooms"></ul>
  </div>

  <div id="weapon-list-wrap">
    <p class="weapon-list-name">사용 가능한 흉기</p>
    <ul id="weapon-list"></ul>
  </div>

  <div id="score-preview" hidden></div>

  <div id="criminal-answer-panel" hidden>
    <h3>AI가 파악한 당신의 범행 (범인인 당신에게만 보입니다)</h3>
    <ul class="score-breakdown" id="criminal-breakdown"></ul>
    <ul id="criminal-answer-key"></ul>
  </div>

  <div id="role-banner" class="role-banner"></div>

  <div id="crime-writing-box" hidden>
    <p>범행을 자유롭게 서술하세요. (장소와 흉기는 위 지도/목록에 있는 이름을 글 속에 자연스럽게 포함해서 써주세요)</p>
    <p id="crime-timer" class="phase-timer"></p>
    <textarea id="crime-text" placeholder="예: 주방에서 칼을 이용해 피해자를 찌른 뒤, 그 칼을 냉장고 속 생선 배 안에 숨겼다.&#10;(장소 · 흉기 · 살해 방법 · 은닉 장소 · 은닉 방법이 자연스럽게 드러나도록 써보세요)"></textarea>
    <button id="submit-crime-btn">범행 제출</button>
  </div>

  <div id="investigation-box" hidden>
    <p id="turn-banner"></p>
    <p id="guess-timer" class="phase-timer"></p>
    <textarea id="guess-text" placeholder="다음을 맞춰보세요: 장소 · 흉기 · 살해 방법 · 은닉 장소 · 은닉 방법&#10;예: 범인은 주방에서 칼로 피해자를 찌른 뒤, 냉장고 속 생선 배 안에 칼을 숨겼을 것이다."></textarea>
    <button id="submit-guess-btn">추리 제출</button>
    <div id="guess-loading" class="loading-box" hidden><span class="spinner">●</span> AI가 추리를 판단 중입니다...</div>
    <div id="advance-box" hidden>
      <span id="advance-hint"></span>
      <button id="next-turn-btn" hidden>다음 차례로</button>
    </div>
  </div>

  <div id="waiting-box" hidden>
    <p id="waiting-message" class="loading-box">다른 플레이어를 기다리는 중...</p>
  </div>

  <div id="investigation-log"></div>

  <ul id="players-round"></ul>
</section>

<section id="result-screen" hidden>
  <h2>라운드 결과</h2>
  <div id="result-body"></div>
  <div id="next-round-box">
    <span id="next-round-hint"></span>
    <button id="next-round-btn" hidden>다음 라운드로</button>
  </div>
</section>

<section id="gameover-screen" hidden>
  <h2>게임 종료</h2>
  <div id="gameover-body"></div>
  <button id="restart-btn" hidden>새 게임 시작</button>
</section>

<h3>로그</h3>
<div id="log"></div>

<script>
const $ = (id) => document.getElementById(id);
const log = (line) => { $('log').textContent += line + "\n"; $('log').scrollTop = $('log').scrollHeight; };

const WEAPON_ICONS = { knife: '🔪', blunt: '🔨', rope: '🪢', poison: '🧪', gun: '🔫', candlestick: '🕯️' };

let ws = null;
let myId = null;
let myRole = null;
let players = [];
let roomState = 'Lobby';
let availableWeapons = [];
let availableMaps = [];
let currentMapId = null;
let currentDetectiveId = null;
let crimeWritingSeconds = 90;
let guessSeconds = 45;
let crimeTimerInterval = null;
let guessTimerInterval = null;
let roundGuessLogHtml = [];

// Reconnect support (docs/RECONNECT_DESIGN.md). Saved right after a
// successful create_room/join_room and sent back verbatim in a `rejoin`
// message if the page reloads (F5, accidental back button + quick
// return). The token is what stops another player in the room from just
// guessing a small player_id and hijacking that seat.
const SESSION_KEY = 'mom_session';
function saveSession(roomCode, playerId, token) {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify({ roomCode, playerId, token })); } catch (e) {}
}
function loadSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (e) { return null; }
}
function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}
let rejoinAttempted = false;

function connect() {
  // Same host the page itself was loaded from, not a hardcoded
  // "localhost" — so this file works unmodified whether it's opened
  // locally (file://, where location.hostname is empty and falls back to
  // localhost) or served from a LAN/port-forwarded machine at some IP:
  // whoever loads http://<that-ip>:<http-port>/ also connects back to
  // ws://<that-ip>:9002 automatically, no manual editing needed per
  // player. The WS port itself still has to match main.cpp's fixed 9002.
  const wsHost = location.hostname || 'localhost';
  ws = new WebSocket(`ws://${wsHost}:9002`);
  ws.onopen = () => {
    $('connection').textContent = '연결됨'; $('connection').className = 'ok';
    const session = loadSession();
    if (session && session.roomCode && session.playerId && session.token) {
      // Set myId immediately rather than waiting for the server's
      // "rejoined" ack — a room_update broadcast triggered by our own
      // reconnect can arrive before that ack does (the server tells
      // everyone else "this player is back" as part of processing the
      // rejoin, before it gets around to replying to us specifically),
      // and is_host / "whose turn" checks need myId to already be right.
      myId = session.playerId;
      rejoinAttempted = true;
      send({ type: 'rejoin', room_code: session.roomCode, player_id: session.playerId, token: session.token });
    }
  };
  ws.onclose = () => { $('connection').textContent = '연결 끊김'; $('connection').className = 'bad'; };
  ws.onerror = () => { $('connection').textContent = '연결 오류'; $('connection').className = 'bad'; };
  ws.onmessage = (e) => handleMessage(JSON.parse(e.data));
}

function send(msg) { ws.send(JSON.stringify(msg)); }

// Applied to any user-controlled or AI-derived text before it goes into
// innerHTML/insertAdjacentHTML — nicknames, guess text, the crime
// confession, and AI evaluation/answer text can all contain characters
// that would otherwise be interpreted as markup. See docs/RECONNECT_DESIGN.md
// ("부수 작업") for the specific injection points this was written for.
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function handleMessage(msg) {
  log('<- ' + JSON.stringify(msg));
  switch (msg.type) {
    case 'room_created':
    case 'joined':
      myId = msg.player_id;
      saveSession(msg.room_code, msg.player_id, msg.token);
      $('room-code-display').textContent = `방 코드: ${msg.room_code}`;
      show('lobby-screen');
      hide('join-screen');
      break;
    case 'rejoined':
      // myId was already set from the saved session when we sent the
      // rejoin (see connect()'s onopen) - nothing else to do here besides
      // leaving the join screen. room_update/board_info/game_state_sync
      // (which may have already arrived, or may still be coming) do the
      // rest of the work of putting the right screen on top.
      rejoinAttempted = false;
      hide('join-screen');
      break;
    case 'game_state_sync':
      applyGameStateSync(msg);
      break;
    case 'room_update':
      players = msg.players;
      roomState = msg.state;
      renderPlayers();
      if (roomState === 'Lobby') { show('lobby-screen'); hide('round-screen'); hide('result-screen'); hide('gameover-screen'); }
      break;
    case 'board_info':
      availableWeapons = msg.weapons;
      availableMaps = msg.available_maps;
      currentMapId = msg.map.id;
      renderMap(msg.map, msg.rooms, msg.edges);
      renderWeaponList();
      renderMapPicker();
      break;
    case 'round_start':
      show('round-screen'); hide('lobby-screen'); hide('result-screen');
      $('round-title').textContent = `라운드 ${msg.round}`;
      $('investigation-log').innerHTML = '';
      roundGuessLogHtml = [];
      crimeWritingSeconds = msg.crime_writing_seconds ?? crimeWritingSeconds;
      hide('crime-writing-box'); hide('investigation-box'); hide('advance-box'); hide('waiting-box');
      hide('score-preview'); hide('criminal-answer-panel');
      hide('guess-loading');
      stopCrimeTimer();
      stopGuessTimer();
      break;
    case 'your_role':
      myRole = msg.role;
      const banner = $('role-banner');
      banner.textContent = myRole === 'criminal' ? '당신은 범인입니다' : '당신은 탐정입니다';
      banner.className = 'role-banner ' + myRole;
      if (myRole === 'criminal') {
        $('crime-text').value = '';
        $('crime-text').disabled = false;
        $('submit-crime-btn').disabled = false;
        show('crime-writing-box'); hide('waiting-box');
        startCrimeTimer(crimeWritingSeconds);
      } else {
        hide('crime-writing-box'); show('waiting-box');
        $('waiting-message').textContent = '범인이 범행을 작성하는 중...';
      }
      break;
    case 'crime_score_revealed':
      $('score-preview').textContent = `이번 범행의 AI 평가 점수: ${msg.score}점`;
      show('score-preview');
      break;
    case 'crime_answer_key':
      // Only the criminal ever receives this message (the server sends it
      // privately) — no role check needed here.
      renderCriminalAnswerKey(msg);
      break;
    case 'investigation_turn_start':
      currentDetectiveId = msg.detective_id;
      guessSeconds = msg.guess_seconds ?? guessSeconds;
      hide('advance-box'); hide('guess-loading'); stopGuessTimer();
      renderPlayers();
      if (currentDetectiveId === myId) {
        show('investigation-box'); hide('waiting-box'); hide('crime-writing-box');
        $('turn-banner').textContent = `당신의 차례입니다 (${msg.attempt}번째 시도 / 최대 3회)`;
        $('guess-text').value = '';
        $('guess-text').disabled = false;
        $('submit-guess-btn').disabled = false;
        show('guess-text'); show('submit-guess-btn');
        startGuessTimer(guessSeconds);
      } else {
        hide('investigation-box'); hide('crime-writing-box'); show('waiting-box');
        const name = players.find(p => p.id === currentDetectiveId)?.name ?? currentDetectiveId;
        $('waiting-message').textContent = `${name} 탐정의 차례입니다 (${msg.attempt}번째 시도)`;
      }
      break;
    case 'guess_pending':
      // Server has accepted this player's guess and is waiting on the AI;
      // swap the form out for a loading indicator immediately so a
      // double-click (or a slow network) can't fire a second submit_guess
      // for the same turn.
      stopGuessTimer();
      hide('guess-text'); hide('submit-guess-btn');
      show('guess-loading');
      break;
    case 'guess_feedback':
      appendLogEntry(msg);
      stopGuessTimer();
      hide('guess-loading');
      show('advance-box');
      renderAdvanceBox(msg.player_id);
      break;
    case 'round_result':
      show('result-screen'); hide('round-screen');
      stopGuessTimer();
      renderRoundResult(msg);
      renderNextRoundBox();
      break;
    case 'game_over':
      show('gameover-screen'); hide('result-screen');
      renderGameOver(msg);
      // Deliberately NOT clearing the saved session here: restart_game
      // reuses this same room (same player_id/token, state reset to
      // Lobby) rather than creating a new one, so a reload after the
      // host restarts still needs to be able to rejoin. If this room
      // really is done for good, the next rejoin attempt (whenever that
      // happens) will fail once the room is torn down, and that failure
      // path is what actually clears it (see the `error` case below).
      break;
    case 'error':
      if (rejoinAttempted) {
        // The saved session is no good anymore (room gone, wrong token,
        // etc.) - drop it and fall back to the normal join screen instead
        // of leaving the player stuck on a blank page forever.
        rejoinAttempted = false;
        clearSession();
        myId = null;
        show('join-screen');
        log('!! 재접속 실패: ' + msg.message);
        break;
      }
      log('!! ' + msg.message);
      alert(msg.message);
      // If a guess got rejected (e.g. a rare permission check) after
      // we'd already optimistically hidden the form, restore it so the
      // player isn't stuck staring at a loading spinner forever.
      if (roomState === 'Investigation' && currentDetectiveId === myId && !$('guess-loading').hidden) {
        hide('guess-loading');
        $('guess-text').value = '';
        show('guess-text'); show('submit-guess-btn');
      }
      break;
  }
}

// Rebuilds the UI directly from the server's current state after a
// reconnect, rather than relying on the normal sequence of per-event
// messages (round_start/your_role/investigation_turn_start/...) — those
// each assume they just happened in order, which a reconnect can't
// guarantee (see docs/RECONNECT_DESIGN.md).
function applyGameStateSync(msg) {
  roomState = msg.state;
  myRole = msg.role;

  hide('crime-writing-box'); hide('investigation-box'); hide('advance-box');
  hide('waiting-box'); hide('score-preview'); hide('criminal-answer-panel'); hide('guess-loading');
  stopCrimeTimer(); stopGuessTimer();

  if (msg.state === 'Lobby' || msg.state === 'GameOver') {
    // room_update's own handling already shows the right screen for these.
    return;
  }

  if ((msg.state === 'Result' || msg.state === 'NextRound') && msg.round_result) {
    // round_result is a one-shot broadcast a reconnecting player missed
    // entirely - the server resends the same payload here (see
    // GameRoom::build_game_state_sync), so just reuse the normal
    // rendering path instead of a generic placeholder.
    show('result-screen'); hide('round-screen'); hide('lobby-screen'); hide('gameover-screen');
    renderRoundResult(msg.round_result);
    renderNextRoundBox();
    return;
  }

  show('round-screen'); hide('lobby-screen'); hide('result-screen'); hide('gameover-screen');
  $('round-title').textContent = `라운드 ${msg.round}`;

  const banner = $('role-banner');
  if (msg.role) {
    banner.textContent = msg.role === 'criminal' ? '당신은 범인입니다' : '당신은 탐정입니다';
    banner.className = 'role-banner ' + msg.role;
  }

  if (msg.crime_score !== null && msg.crime_score !== undefined) {
    $('score-preview').textContent = `이번 범행의 AI 평가 점수: ${msg.crime_score}점`;
    show('score-preview');
  }

  if (msg.answer_key) {
    renderCriminalAnswerKey({ answer_key: msg.answer_key, score_breakdown: msg.score_breakdown });
  }

  if (msg.state === 'CrimeWriting' && msg.role === 'criminal') {
    show('crime-writing-box');
    // Not attempting to restore the exact remaining time here (the
    // server enforces the real deadline regardless) - see
    // docs/RECONNECT_DESIGN.md's explicitly-scoped simplification.
  } else if (msg.state === 'Investigation') {
    currentDetectiveId = msg.current_detective_id;
    if (msg.current_detective_id === myId) {
      show('investigation-box');
      $('turn-banner').textContent = `당신의 차례입니다 (${msg.current_attempt}번째 시도 / 최대 3회)`;
    } else {
      show('waiting-box');
      const name = players.find(p => p.id === msg.current_detective_id)?.name ?? msg.current_detective_id;
      // .textContent below already renders this literally (no HTML
      // interpretation either way), so no escapeHtml() needed here.
      $('waiting-message').textContent = `${name} 탐정의 차례입니다 (${msg.current_attempt}번째 시도)`;
    }
  } else {
    // AIJudging / Result / NextRound: nothing for this player to actively
    // do right now: round_result (already broadcast, or about to be) and
    // the normal handlers take it from here.
    show('waiting-box');
    $('waiting-message').textContent = '진행 상황을 기다리는 중...';
  }
}

function renderMap(map, rooms, edges) {
  $('map-name').textContent = `지도: ${map.name} — 범인은 아래 방 중 한 곳을 글 속에 자연스럽게 써서 묘사합니다.`;

  if (map.image) {
    $('map-image').src = map.image;
    show('map-image');
  } else {
    hide('map-image');
  }

  const neighborsOf = (id) => edges
    .filter(([a, b]) => a === id || b === id)
    .map(([a, b]) => (a === id ? b : a))
    .map(nid => rooms.find(r => r.id === nid)?.name ?? nid);

  $('map-rooms').innerHTML = rooms.map(r => {
    const links = neighborsOf(r.id).join(', ');
    const watch = r.surveilled
      ? ` <span class="badge watch">${map.surveillance_label ?? '감시'} 상시 감시 중</span>`
      : '';
    return `<li><span class="room-name">${r.name}</span>${watch} <span class="room-links">— 연결: ${links}</span></li>`;
  }).join('');
}

function renderMapPicker() {
  if (!availableMaps.length) return;
  const isHost = players.find(p => p.id === myId)?.is_host;
  if (isHost) {
    $('map-picker').innerHTML = availableMaps.map(m =>
      `<option value="${m.id}" ${m.id === currentMapId ? 'selected' : ''}>${m.name}</option>`
    ).join('');
    show('map-picker'); hide('map-picker-readonly');
  } else {
    $('map-picker-readonly').textContent = availableMaps.find(m => m.id === currentMapId)?.name ?? currentMapId;
    hide('map-picker'); show('map-picker-readonly');
  }
}

function renderWeaponList() {
  $('weapon-list').innerHTML = availableWeapons.map(w =>
    `<li>${WEAPON_ICONS[w.id] || ''} ${w.name}</li>`
  ).join('');
}

function renderPlayers() {
  const isHost = players.find(p => p.id === myId)?.is_host;
  const list = players.map(p => {
    const badges = [];
    if (p.is_host) badges.push('<span class="badge host">방장</span>');
    if (p.id === currentDetectiveId && roomState === 'Investigation') badges.push('<span class="badge turn">차례</span>');
    if (p.has_been_criminal) badges.push('<span class="badge">범인 완료</span>');
    if (!p.connected) badges.push('<span class="badge">연결 끊김</span>');
    return `<li><span>${escapeHtml(p.name)}</span><span>${p.score}점 ${badges.join('')}</span></li>`;
  }).join('');
  $('players').innerHTML = list;
  $('players-round').innerHTML = list;

  $('start-btn').hidden = !(roomState === 'Lobby' && isHost);
  $('lobby-hint').textContent = players.length < 3 ? `${3 - players.length}명 더 필요합니다.` :
                                 players.length > 6 ? '최대 6명까지 가능합니다.' : '시작할 준비가 되었습니다.';
  renderMapPicker();
}

function appendLogEntry(msg) {
  const name = players.find(p => p.id === msg.player_id)?.name ?? msg.player_id;
  const aspects = msg.aspects.map(a => `<span>${a.aspect}: ${a.verdict}</span>`).join('');
  const guessLine = msg.timed_out ? '(시간 초과 - 응답 없음)' : `"${escapeHtml(msg.guess_text)}"`;
  const html = `
    <div class="log-entry${msg.correct ? ' correct' : ''}">
      <div><span class="who">${escapeHtml(name)}</span> (${msg.attempt}번째 시도) — ${msg.correct ? '정답' : '오답'}</div>
      <div>${guessLine}</div>
      <div class="aspects">${aspects}</div>
    </div>
  `;
  $('investigation-log').insertAdjacentHTML('afterbegin', html);
  // Kept so the result screen can show every guess made this round
  // alongside the crime reveal, instead of it only being visible while
  // round-screen (a different section) was showing.
  roundGuessLogHtml.push(html);
}

// No auto-advance timer anymore (see server-side GameRoom's class comment
// for why) — next_turn/next_round are always manual, so these just show
// the button to whoever is actually allowed to click it (mirroring the
// server's own permission check) and a hint for everyone else.
function renderAdvanceBox(submitterId) {
  const isHost = players.find(p => p.id === myId)?.is_host;
  const canAdvance = submitterId === myId || isHost;
  $('next-turn-btn').hidden = !canAdvance;
  if (canAdvance) {
    $('advance-hint').textContent = '';
  } else {
    const name = players.find(p => p.id === submitterId)?.name ?? submitterId;
    $('advance-hint').textContent = `${name} 님 또는 방장이 다음 차례로 넘길 때까지 기다려주세요.`;
  }
}

function renderNextRoundBox() {
  const isHost = players.find(p => p.id === myId)?.is_host;
  $('next-round-btn').hidden = !isHost;
  $('next-round-hint').textContent = isHost ? '' : '방장이 다음 라운드로 넘길 때까지 기다려주세요.';
}

function renderCriminalAnswerKey(msg) {
  const breakdown = (msg.score_breakdown || []).map(item => {
    const pct = item.max > 0 ? Math.round((item.score / item.max) * 100) : 0;
    return `<li>
      <div class="cat-row"><span>${item.category}</span><span>${item.score} / ${item.max}</span></div>
      <div class="cat-track"><div class="cat-fill" style="width:${pct}%"></div></div>
    </li>`;
  }).join('');
  const answers = (msg.answer_key || []).map(a => `<li><b>${a.aspect}:</b> ${escapeHtml(a.answer)}</li>`).join('');
  $('criminal-breakdown').innerHTML = breakdown;
  $('criminal-answer-key').innerHTML = answers;
  show('criminal-answer-panel');
}

// Composition-phase countdowns (crime writing / a guess) purely reflect
// server-enforced time limits so players can pace themselves — the
// server is what actually decides on timeout, this is just a clock.
function startCrimeTimer(seconds) {
  stopCrimeTimer();
  let remaining = seconds;
  const render = () => {
    $('crime-timer').textContent = `⏱ 남은 시간: ${remaining}초`;
    $('crime-timer').classList.toggle('warn', remaining <= 15);
  };
  render();
  crimeTimerInterval = setInterval(() => {
    remaining--;
    if (remaining < 0) { $('crime-timer').textContent = '⏱ 시간 초과'; stopCrimeTimer(); return; }
    render();
  }, 1000);
}
function stopCrimeTimer() {
  if (crimeTimerInterval) { clearInterval(crimeTimerInterval); crimeTimerInterval = null; }
  $('crime-timer').textContent = '';
  $('crime-timer').classList.remove('warn');
}

function startGuessTimer(seconds) {
  stopGuessTimer();
  let remaining = seconds;
  const render = () => {
    $('guess-timer').textContent = `⏱ 남은 시간: ${remaining}초`;
    $('guess-timer').classList.toggle('warn', remaining <= 10);
  };
  render();
  guessTimerInterval = setInterval(() => {
    remaining--;
    if (remaining < 0) { $('guess-timer').textContent = '⏱ 시간 초과'; stopGuessTimer(); return; }
    render();
  }, 1000);
}
function stopGuessTimer() {
  if (guessTimerInterval) { clearInterval(guessTimerInterval); guessTimerInterval = null; }
  $('guess-timer').textContent = '';
  $('guess-timer').classList.remove('warn');
}

function renderRoundResult(msg) {
  const gained = Object.entries(msg.scores_gained).map(([id, amt]) => {
    const p = players.find(pl => String(pl.id) === id);
    return `<li>${escapeHtml(p ? p.name : id)}: +${amt}점</li>`;
  }).join('');
  const breakdown = (msg.score_breakdown || []).map(item => {
    const pct = item.max > 0 ? Math.round((item.score / item.max) * 100) : 0;
    return `<li>
      <div class="cat-row"><span>${item.category}</span><span>${item.score} / ${item.max}</span></div>
      <div class="cat-track"><div class="cat-fill" style="width:${pct}%"></div></div>
    </li>`;
  }).join('');
  $('result-body').innerHTML = `
    <p><b>범인:</b> ${escapeHtml(players.find(p => p.id === msg.criminal_id)?.name ?? msg.criminal_id)}</p>
    <p><b>장소:</b> ${msg.location} / <b>흉기:</b> ${msg.weapon}</p>
    <p><b>범행 전문:</b> ${escapeHtml(msg.crime_text)}</p>
    <p><b>범행 총점:</b> ${msg.crime_score} / 100</p>
    <ul class="score-breakdown">${breakdown}</ul>
    <p><b>총평:</b> ${escapeHtml(msg.evaluation)}</p>
    <ul>${gained}</ul>
    <h3>이번 라운드의 추리들</h3>
    <div id="result-guess-log">${roundGuessLogHtml.join('') || '<p>제출된 추리가 없습니다.</p>'}</div>
  `;
}

function renderGameOver(msg) {
  const rows = Object.entries(msg.total_scores)
    .sort((a, b) => b[1] - a[1])
    .map(([id, score]) => {
      const p = players.find(pl => String(pl.id) === id);
      const win = String(msg.winner_id) === id ? ' 🏆' : '';
      return `<li>${escapeHtml(p ? p.name : id)}: ${score}점${win}</li>`;
    }).join('');
  $('gameover-body').innerHTML = `<ul>${rows}</ul>`;
  $('restart-btn').hidden = !players.find(p => p.id === myId)?.is_host;
}

function show(id) { $(id).hidden = false; }
function hide(id) { $(id).hidden = true; }

$('create-room-btn').onclick = () => {
  const name = $('name-input').value.trim();
  if (!name) return;
  send({ type: 'create_room', name });
};
$('join-room-btn').onclick = () => {
  const name = $('name-input').value.trim();
  const roomCode = $('room-code-input').value.trim();
  if (!name || !roomCode) return;
  send({ type: 'join_room', room_code: roomCode, name });
};
$('start-btn').onclick = () => send({ type: 'start_game' });
$('map-picker').onchange = () => send({ type: 'select_map', map_id: $('map-picker').value });
$('restart-btn').onclick = () => send({ type: 'restart_game' });
$('submit-crime-btn').onclick = () => {
  const text = $('crime-text').value.trim();
  if (!text) return;
  stopCrimeTimer();
  send({ type: 'submit_crime', text });
  hide('crime-writing-box'); show('waiting-box');
  $('waiting-message').textContent = 'AI가 범행을 평가하는 중...';
};
$('submit-guess-btn').onclick = () => {
  const text = $('guess-text').value.trim();
  if (!text) return;
  // Lock the form immediately rather than waiting for the server's
  // guess_pending round trip - the server still enforces this
  // authoritatively (a stale double-click can't corrupt whose turn it
  // is), this is purely for a snappier, no-flicker loading state.
  stopGuessTimer();
  hide('guess-text'); hide('submit-guess-btn');
  show('guess-loading');
  send({ type: 'submit_guess', text });
};
$('next-turn-btn').onclick = () => {
  send({ type: 'next_turn' });
};
$('next-round-btn').onclick = () => {
  send({ type: 'next_round' });
};

connect();
</script>
</body>
</html>
