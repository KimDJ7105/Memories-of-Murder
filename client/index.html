<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>살인의 추억</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 720px; margin: 32px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.4em; }
  section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  #connection { font-size: 0.85em; color: #888; margin-bottom: 12px; }
  #connection.ok { color: #2a7; }
  #connection.bad { color: #c33; }
  input[type=text], textarea { width: 100%; padding: 8px; font-size: 1em; border: 1px solid #ccc; border-radius: 4px; }
  textarea { min-height: 100px; resize: vertical; }
  button { padding: 8px 16px; font-size: 1em; border: 0; border-radius: 4px; background: #333; color: #fff; cursor: pointer; margin-top: 8px; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  ul#players { list-style: none; padding: 0; }
  ul#players li { padding: 4px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
  .badge { font-size: 0.75em; padding: 2px 6px; border-radius: 4px; background: #eee; margin-left: 6px; }
  .badge.host { background: #ffe08a; }
  .badge.criminal { background: #f6a; color: #fff; }
  .role-banner { font-weight: bold; padding: 8px; border-radius: 4px; margin-bottom: 12px; }
  .role-banner.criminal { background: #fdd; }
  .role-banner.detective { background: #ddf; }
  #log { background: #fafafa; border: 1px solid #eee; padding: 8px; font-size: 0.8em; max-height: 160px; overflow-y: auto; white-space: pre-wrap; }
  .error { color: #c33; font-weight: bold; }
</style>
</head>
<body>
<h1>살인의 추억</h1>
<div id="connection" class="bad">연결 중...</div>

<section id="join-screen">
  <h2>입장</h2>
  <input id="name-input" type="text" placeholder="닉네임">
  <button id="join-btn">입장하기</button>
</section>

<section id="lobby-screen" hidden>
  <h2>대기실</h2>
  <ul id="players"></ul>
  <button id="start-btn" hidden>게임 시작 (3~6명 필요)</button>
  <p id="lobby-hint"></p>
</section>

<section id="round-screen" hidden>
  <h2 id="round-title"></h2>
  <div id="role-banner" class="role-banner"></div>

  <div id="crime-writing-box" hidden>
    <p>범행을 자유롭게 서술하세요.</p>
    <textarea id="crime-text"></textarea>
    <button id="submit-crime-btn">범행 제출</button>
  </div>

  <div id="investigation-box" hidden>
    <p id="attempt-info"></p>
    <textarea id="guess-text"></textarea>
    <button id="submit-guess-btn">추리 제출</button>
    <p id="guess-status"></p>
  </div>

  <div id="waiting-box" hidden>
    <p id="waiting-message">다른 플레이어를 기다리는 중...</p>
  </div>

  <ul id="players-round"></ul>
</section>

<section id="result-screen" hidden>
  <h2>라운드 결과</h2>
  <div id="result-body"></div>
</section>

<section id="gameover-screen" hidden>
  <h2>게임 종료</h2>
  <div id="gameover-body"></div>
</section>

<h3>로그</h3>
<div id="log"></div>

<script>
const $ = (id) => document.getElementById(id);
const log = (line) => { $('log').textContent += line + "\n"; $('log').scrollTop = $('log').scrollHeight; };

let ws = null;
let myId = null;
let myRole = null;
let players = [];
let roomState = 'Lobby';
let pendingDetectives = [];

function connect() {
  ws = new WebSocket('ws://localhost:9002');
  ws.onopen = () => { $('connection').textContent = '연결됨'; $('connection').className = 'ok'; };
  ws.onclose = () => { $('connection').textContent = '연결 끊김'; $('connection').className = 'bad'; };
  ws.onerror = () => { $('connection').textContent = '연결 오류'; $('connection').className = 'bad'; };
  ws.onmessage = (e) => handleMessage(JSON.parse(e.data));
}

function send(msg) { ws.send(JSON.stringify(msg)); }

function handleMessage(msg) {
  log('<- ' + JSON.stringify(msg));
  switch (msg.type) {
    case 'joined':
      myId = msg.player_id;
      show('lobby-screen');
      hide('join-screen');
      break;
    case 'room_update':
      players = msg.players;
      roomState = msg.state;
      renderPlayers();
      if (roomState === 'Lobby') { show('lobby-screen'); hide('round-screen'); hide('result-screen'); }
      break;
    case 'round_start':
      show('round-screen'); hide('lobby-screen'); hide('result-screen');
      $('round-title').textContent = `라운드 ${msg.round} — 장소: ${msg.location} / 무기: ${msg.weapon}`;
      hide('crime-writing-box'); hide('investigation-box'); hide('waiting-box');
      break;
    case 'your_role':
      myRole = msg.role;
      const banner = $('role-banner');
      banner.textContent = myRole === 'criminal' ? '당신은 범인입니다' : '당신은 탐정입니다';
      banner.className = 'role-banner ' + myRole;
      if (myRole === 'criminal') {
        show('crime-writing-box'); hide('waiting-box');
      } else {
        hide('crime-writing-box'); show('waiting-box');
        $('waiting-message').textContent = '범인이 범행을 작성하는 중...';
      }
      break;
    case 'investigation_start':
      pendingDetectives = msg.pending_detectives;
      if (pendingDetectives.includes(myId)) {
        show('investigation-box'); hide('waiting-box');
        $('attempt-info').textContent = `추리 시도 ${msg.attempt} / 3`;
        $('guess-text').value = '';
        $('guess-status').textContent = '';
      } else if (myRole === 'detective') {
        hide('investigation-box'); show('waiting-box');
        $('waiting-message').textContent = '당신은 이미 정답을 맞혔습니다. 다른 탐정을 기다리는 중...';
      } else {
        hide('crime-writing-box'); hide('investigation-box'); show('waiting-box');
        $('waiting-message').textContent = `탐정들이 추리 중... (시도 ${msg.attempt})`;
      }
      break;
    case 'guess_result':
      if (myRole === 'detective' && pendingDetectives.includes(myId)) {
        const correct = msg.results[String(myId)];
        $('guess-status').textContent = correct ? '정답입니다!' : '오답입니다. 다음 시도를 기다리세요.';
      }
      break;
    case 'round_result':
      show('result-screen'); hide('round-screen');
      renderRoundResult(msg);
      break;
    case 'game_over':
      show('gameover-screen'); hide('result-screen');
      renderGameOver(msg);
      break;
    case 'error':
      log('!! ' + msg.message);
      alert(msg.message);
      break;
  }
}

function renderPlayers() {
  const isHost = players.find(p => p.id === myId)?.is_host;
  const list = players.map(p => {
    const badges = [];
    if (p.is_host) badges.push('<span class="badge host">방장</span>');
    if (p.has_been_criminal) badges.push('<span class="badge">범인 완료</span>');
    if (!p.connected) badges.push('<span class="badge">연결 끊김</span>');
    return `<li><span>${p.name}</span><span>${p.score}점 ${badges.join('')}</span></li>`;
  }).join('');
  $('players').innerHTML = list;
  $('players-round').innerHTML = list;

  $('start-btn').hidden = !(roomState === 'Lobby' && isHost);
  $('lobby-hint').textContent = players.length < 3 ? `${3 - players.length}명 더 필요합니다.` :
                                 players.length > 6 ? '최대 6명까지 가능합니다.' : '시작할 준비가 되었습니다.';
}

function renderRoundResult(msg) {
  const gained = Object.entries(msg.scores_gained).map(([id, amt]) => {
    const p = players.find(pl => String(pl.id) === id);
    return `<li>${p ? p.name : id}: +${amt}점</li>`;
  }).join('');
  $('result-body').innerHTML = `
    <p><b>범인:</b> ${players.find(p => p.id === msg.criminal_id)?.name ?? msg.criminal_id}</p>
    <p><b>범행:</b> ${msg.crime_text}</p>
    <p><b>범행 점수:</b> ${msg.crime_score} — ${msg.evaluation}</p>
    <ul>${gained}</ul>
  `;
}

function renderGameOver(msg) {
  const rows = Object.entries(msg.total_scores)
    .sort((a, b) => b[1] - a[1])
    .map(([id, score]) => {
      const p = players.find(pl => String(pl.id) === id);
      const win = String(msg.winner_id) === id ? ' 🏆' : '';
      return `<li>${p ? p.name : id}: ${score}점${win}</li>`;
    }).join('');
  $('gameover-body').innerHTML = `<ul>${rows}</ul>`;
}

function show(id) { $(id).hidden = false; }
function hide(id) { $(id).hidden = true; }

$('join-btn').onclick = () => {
  const name = $('name-input').value.trim();
  if (!name) return;
  send({ type: 'join', name });
};
$('start-btn').onclick = () => send({ type: 'start_game' });
$('submit-crime-btn').onclick = () => {
  const text = $('crime-text').value.trim();
  if (!text) return;
  send({ type: 'submit_crime', text });
  hide('crime-writing-box'); show('waiting-box');
  $('waiting-message').textContent = 'AI가 범행을 평가하는 중...';
};
$('submit-guess-btn').onclick = () => {
  const text = $('guess-text').value.trim();
  if (!text) return;
  send({ type: 'submit_guess', text });
  $('guess-status').textContent = '제출됨. 결과를 기다리는 중...';
};

connect();
</script>
</body>
</html>
