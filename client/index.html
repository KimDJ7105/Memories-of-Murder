<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Memories of Murder - Connection Test</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 40px auto; }
  #log { border: 1px solid #ccc; height: 240px; overflow-y: auto; padding: 8px; white-space: pre-wrap; }
  #status { font-weight: bold; }
  .ok { color: green; }
  .bad { color: red; }
</style>
</head>
<body>
  <h1>Memories of Murder - WebSocket 연결 테스트</h1>
  <p>상태: <span id="status" class="bad">연결 안 됨</span></p>
  <div id="log"></div>
  <input id="msg" type="text" placeholder="보낼 메시지" style="width: 70%">
  <button id="send">전송</button>

<script>
  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');
  const log = (line) => { logEl.textContent += line + "\n"; logEl.scrollTop = logEl.scrollHeight; };

  const ws = new WebSocket('ws://localhost:9002');

  ws.onopen = () => { statusEl.textContent = '연결됨'; statusEl.className = 'ok'; log('[connected]'); };
  ws.onclose = () => { statusEl.textContent = '끊김'; statusEl.className = 'bad'; log('[disconnected]'); };
  ws.onerror = (e) => log('[error] ' + e.message || 'unknown error');
  ws.onmessage = (e) => log('server> ' + e.data);

  document.getElementById('send').onclick = () => {
    const input = document.getElementById('msg');
    if (input.value && ws.readyState === WebSocket.OPEN) {
      log('client> ' + input.value);
      ws.send(input.value);
      input.value = '';
    }
  };
  document.getElementById('msg').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('send').click();
  });
</script>
</body>
</html>
