<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="640" height="380" fill="#ece2c6"/>
  <text x="320" y="34" text-anchor="middle" font-size="24" fill="#2b2116" letter-spacing="4">낡은 저택 1층 평면도</text>
  <line x1="120" y1="46" x2="520" y2="46" stroke="#8a7a55" stroke-width="1.5"/>

  <!-- Outer wall -->
  <rect x="20" y="66" width="600" height="300" fill="#e3d6ac" stroke="#2b2116" stroke-width="5"/>

  <!-- Room dividers (with door gaps at each connection) -->
  <!-- vertical divider 1 (attic/library , garage/kitchen) at x=220 -->
  <line x1="220" y1="66"  x2="220" y2="186" stroke="#2b2116" stroke-width="4"/>
  <line x1="220" y1="216" x2="220" y2="366" stroke="#2b2116" stroke-width="4"/>
  <!-- vertical divider 2 (library/garden , kitchen/basement) at x=420 -->
  <line x1="420" y1="66"  x2="420" y2="186" stroke="#2b2116" stroke-width="4"/>
  <line x1="420" y1="216" x2="420" y2="366" stroke="#2b2116" stroke-width="4"/>

  <!-- horizontal divider (attic/garage) at y=216, left third -->
  <line x1="20"  y1="216" x2="100" y2="216" stroke="#2b2116" stroke-width="4"/>
  <line x1="140" y1="216" x2="220" y2="216" stroke="#2b2116" stroke-width="4"/>
  <!-- horizontal divider (library/kitchen) at y=216, middle third -->
  <line x1="220" y1="216" x2="300" y2="216" stroke="#2b2116" stroke-width="4"/>
  <line x1="340" y1="216" x2="420" y2="216" stroke="#2b2116" stroke-width="4"/>
  <!-- horizontal divider (garden/basement) at y=216, right third -->
  <line x1="420" y1="216" x2="500" y2="216" stroke="#2b2116" stroke-width="4"/>
  <line x1="540" y1="216" x2="620" y2="216" stroke="#2b2116" stroke-width="4"/>

  <!-- Room labels -->
  <text x="120" y="145" text-anchor="middle" font-size="20" fill="#2b2116">다락방</text>
  <text x="120" y="168" text-anchor="middle" font-size="12" fill="#5a4d38" font-style="italic">attic</text>

  <text x="320" y="145" text-anchor="middle" font-size="20" fill="#2b2116">서재</text>
  <text x="320" y="168" text-anchor="middle" font-size="12" fill="#5a4d38" font-style="italic">library</text>

  <text x="520" y="145" text-anchor="middle" font-size="20" fill="#2b2116">정원</text>
  <text x="520" y="168" text-anchor="middle" font-size="12" fill="#5a4d38" font-style="italic">garden</text>

  <text x="120" y="298" text-anchor="middle" font-size="20" fill="#2b2116">차고</text>
  <text x="120" y="321" text-anchor="middle" font-size="12" fill="#5a4d38" font-style="italic">garage</text>

  <text x="320" y="298" text-anchor="middle" font-size="20" fill="#2b2116">주방</text>
  <text x="320" y="321" text-anchor="middle" font-size="12" fill="#5a4d38" font-style="italic">kitchen</text>

  <text x="520" y="298" text-anchor="middle" font-size="20" fill="#2b2116">지하실</text>
  <text x="520" y="321" text-anchor="middle" font-size="12" fill="#5a4d38" font-style="italic">basement</text>

  <!-- Compass rose -->
  <g transform="translate(580,90)">
    <circle r="16" fill="none" stroke="#8a7a55" stroke-width="1.5"/>
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#8a7a55" stroke-width="1"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#8a7a55" stroke-width="1"/>
    <text x="0" y="-20" text-anchor="middle" font-size="11" fill="#5a4d38">N</text>
  </g>
</svg>
