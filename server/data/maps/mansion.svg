<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="840" height="460" fill="#ece2c6"/>
  <text x="420" y="34" text-anchor="middle" font-size="24" fill="#2b2116" letter-spacing="4">낡은 저택 단면도</text>
  <line x1="140" y1="46" x2="700" y2="46" stroke="#8a7a55" stroke-width="1.5"/>

  <!-- ATTIC (above library) with a simple pitched roof -->
  <polygon points="30,70 140,30 250,70" fill="#d8c9a0" stroke="#2b2116" stroke-width="3"/>
  <rect x="40" y="70" width="200" height="120" fill="#e3d6ac" stroke="#2b2116" stroke-width="4"/>
  <text x="140" y="130" text-anchor="middle" font-size="19" fill="#2b2116">다락방</text>
  <text x="140" y="152" text-anchor="middle" font-size="11" fill="#5a4d38" font-style="italic">attic</text>
  <!-- gap + stairs down to library -->
  <line x1="40" y1="190" x2="105" y2="190" stroke="#2b2116" stroke-width="4"/>
  <line x1="175" y1="190" x2="240" y2="190" stroke="#2b2116" stroke-width="4"/>
  <g stroke="#8a7a55" stroke-width="2">
    <line x1="112" y1="190" x2="120" y2="197"/>
    <line x1="122" y1="190" x2="130" y2="197"/>
    <line x1="132" y1="190" x2="140" y2="197"/>
    <line x1="142" y1="190" x2="150" y2="197"/>
    <line x1="152" y1="190" x2="160" y2="197"/>
    <line x1="162" y1="190" x2="170" y2="197"/>
  </g>

  <!-- Ground floor: library | kitchen | garage | garden -->
  <rect x="40"  y="190" width="200" height="140" fill="#e3d6ac" stroke="#2b2116" stroke-width="4"/>
  <text x="140" y="255" text-anchor="middle" font-size="19" fill="#2b2116">서재</text>
  <text x="140" y="277" text-anchor="middle" font-size="11" fill="#5a4d38" font-style="italic">library</text>

  <rect x="240" y="190" width="200" height="140" fill="#e3d6ac" stroke="#2b2116" stroke-width="4"/>
  <text x="340" y="255" text-anchor="middle" font-size="19" fill="#2b2116">주방</text>
  <text x="340" y="277" text-anchor="middle" font-size="11" fill="#5a4d38" font-style="italic">kitchen</text>
  <!-- CCTV: this room is always under surveillance (surveilled: true) -->
  <g transform="translate(390,205)">
    <polygon points="0,0 18,-6 18,10 0,4" fill="#7a1f1f" stroke="#2b2116" stroke-width="1.5"/>
    <circle cx="14" cy="2" r="3" fill="#2b2116"/>
    <line x1="18" y1="-2" x2="34" y2="-14" stroke="#7a1f1f" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="18" y1="8" x2="34" y2="20" stroke="#7a1f1f" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="9" y="26" text-anchor="middle" font-size="10" fill="#7a1f1f" font-weight="bold">CCTV</text>
  </g>

  <rect x="440" y="190" width="200" height="140" fill="#e3d6ac" stroke="#2b2116" stroke-width="4"/>
  <text x="540" y="255" text-anchor="middle" font-size="19" fill="#2b2116">차고</text>
  <text x="540" y="277" text-anchor="middle" font-size="11" fill="#5a4d38" font-style="italic">garage</text>

  <!-- door: library <-> kitchen -->
  <line x1="240" y1="190" x2="240" y2="235" stroke="#2b2116" stroke-width="4"/>
  <line x1="240" y1="285" x2="240" y2="330" stroke="#2b2116" stroke-width="4"/>
  <!-- door: kitchen <-> garage -->
  <line x1="440" y1="190" x2="440" y2="235" stroke="#2b2116" stroke-width="4"/>
  <line x1="440" y1="285" x2="440" y2="330" stroke="#2b2116" stroke-width="4"/>

  <!-- GARDEN (outdoor, beside garage) -->
  <rect x="640" y="190" width="180" height="140" fill="#c3cf9e" stroke="#5a6b3a" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="730" y="255" text-anchor="middle" font-size="19" fill="#2b2116">정원</text>
  <text x="730" y="277" text-anchor="middle" font-size="11" fill="#5a4d38" font-style="italic">garden</text>
  <circle cx="670" cy="300" r="9" fill="#8ba668" stroke="#5a6b3a" stroke-width="1.5"/>
  <circle cx="795" cy="210" r="9" fill="#8ba668" stroke="#5a6b3a" stroke-width="1.5"/>
  <!-- gate: garage <-> garden (dashed, outdoor opening, no solid wall between) -->
  <line x1="640" y1="190" x2="640" y2="235" stroke="#2b2116" stroke-width="4"/>
  <line x1="640" y1="285" x2="640" y2="330" stroke="#2b2116" stroke-width="4"/>

  <!-- BASEMENT (below kitchen), underground styling -->
  <rect x="240" y="330" width="200" height="100" fill="#b8a878" stroke="#2b2116" stroke-width="4"/>
  <g stroke="#8a7a55" stroke-width="1">
    <line x1="250" y1="345" x2="430" y2="345"/>
    <line x1="250" y1="360" x2="430" y2="360"/>
    <line x1="250" y1="410" x2="430" y2="410"/>
  </g>
  <text x="340" y="390" text-anchor="middle" font-size="19" fill="#2b2116">지하실</text>
  <text x="340" y="410" text-anchor="middle" font-size="11" fill="#3a3020" font-style="italic">basement</text>
  <!-- gap + stairs down from kitchen -->
  <line x1="240" y1="330" x2="305" y2="330" stroke="#2b2116" stroke-width="4"/>
  <line x1="375" y1="330" x2="440" y2="330" stroke="#2b2116" stroke-width="4"/>
  <g stroke="#8a7a55" stroke-width="2">
    <line x1="312" y1="330" x2="320" y2="337"/>
    <line x1="322" y1="330" x2="330" y2="337"/>
    <line x1="332" y1="330" x2="340" y2="337"/>
    <line x1="342" y1="330" x2="350" y2="337"/>
    <line x1="352" y1="330" x2="360" y2="337"/>
    <line x1="362" y1="330" x2="368" y2="337"/>
  </g>

  <!-- Compass rose -->
  <g transform="translate(795,90)">
    <circle r="16" fill="none" stroke="#8a7a55" stroke-width="1.5"/>
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#8a7a55" stroke-width="1"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#8a7a55" stroke-width="1"/>
    <text x="0" y="-20" text-anchor="middle" font-size="11" fill="#5a4d38">N</text>
  </g>
</svg>
