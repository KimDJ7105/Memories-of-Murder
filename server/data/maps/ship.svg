<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="900" height="420" fill="#ece2c6"/>
  <text x="450" y="34" text-anchor="middle" font-size="24" fill="#2b2116" letter-spacing="4">심야의 유람선 단면도</text>
  <line x1="180" y1="46" x2="720" y2="46" stroke="#8a7a55" stroke-width="1.5"/>

  <!-- sea -->
  <path d="M 0 360 Q 30 350 60 360 T 120 360 T 180 360 T 240 360 T 300 360 T 360 360 T 420 360 T 480 360 T 540 360 T 600 360 T 660 360 T 720 360 T 780 360 T 840 360 T 900 360"
        fill="none" stroke="#8a9fae" stroke-width="2"/>

  <!-- hull bow (pointed front) -->
  <polygon points="40,235 150,160 150,310" fill="#e3d6ac" stroke="#2b2116" stroke-width="4" stroke-linejoin="round"/>

  <!-- BRIDGE (elevated, above deck) -->
  <rect x="170" y="70" width="130" height="90" fill="#e3d6ac" stroke="#2b2116" stroke-width="4"/>
  <text x="235" y="112" text-anchor="middle" font-size="18" fill="#2b2116">조타실</text>
  <text x="235" y="133" text-anchor="middle" font-size="11" fill="#5a4d38" font-style="italic">bridge</text>
  <!-- 당직 선원: this room always has a crewman on watch (surveilled: true) -->
  <g transform="translate(258,86)">
    <circle cx="0" cy="0" r="4" fill="#7a1f1f"/>
    <path d="M -5,5 L 5,5 L 4,16 L -4,16 Z" fill="#7a1f1f"/>
    <text x="0" y="28" text-anchor="middle" font-size="9" fill="#7a1f1f" font-weight="bold">당직</text>
  </g>
  <!-- gap + stairs down to deck -->
  <line x1="170" y1="160" x2="212" y2="160" stroke="#2b2116" stroke-width="4"/>
  <line x1="258" y1="160" x2="300" y2="160" stroke="#2b2116" stroke-width="4"/>
  <g stroke="#8a7a55" stroke-width="2">
    <line x1="219" y1="160" x2="227" y2="167"/>
    <line x1="229" y1="160" x2="237" y2="167"/>
    <line x1="239" y1="160" x2="247" y2="167"/>
    <line x1="249" y1="160" x2="251" y2="167"/>
  </g>

  <!-- main deck row: deck | lounge | cabin | galley | engine_room -->
  <rect x="150" y="160" width="150" height="150" fill="#cfe0dd" stroke="#4a5c54" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="225" y="230" text-anchor="middle" font-size="18" fill="#2b2116">갑판</text>
  <text x="225" y="251" text-anchor="middle" font-size="11" fill="#4a5c54" font-style="italic">deck</text>

  <rect x="300" y="160" width="150" height="150" fill="#e3d6ac" stroke="#2b2116" stroke-width="4"/>
  <text x="375" y="230" text-anchor="middle" font-size="18" fill="#2b2116">라운지</text>
  <text x="375" y="251" text-anchor="middle" font-size="11" fill="#5a4d38" font-style="italic">lounge</text>

  <rect x="450" y="160" width="150" height="150" fill="#e3d6ac" stroke="#2b2116" stroke-width="4"/>
  <text x="525" y="230" text-anchor="middle" font-size="18" fill="#2b2116">선실</text>
  <text x="525" y="251" text-anchor="middle" font-size="11" fill="#5a4d38" font-style="italic">cabin</text>

  <rect x="600" y="160" width="150" height="150" fill="#e3d6ac" stroke="#2b2116" stroke-width="4"/>
  <text x="675" y="230" text-anchor="middle" font-size="18" fill="#2b2116">주방</text>
  <text x="675" y="251" text-anchor="middle" font-size="11" fill="#5a4d38" font-style="italic">galley</text>

  <rect x="750" y="160" width="110" height="150" fill="#b8a878" stroke="#2b2116" stroke-width="4"/>
  <g stroke="#8a7a55" stroke-width="1">
    <line x1="760" y1="180" x2="850" y2="180"/>
    <line x1="760" y1="195" x2="850" y2="195"/>
  </g>
  <circle cx="785" cy="255" r="14" fill="none" stroke="#5a4d38" stroke-width="2"/>
  <circle cx="820" cy="255" r="10" fill="none" stroke="#5a4d38" stroke-width="2"/>
  <text x="805" y="230" text-anchor="middle" font-size="16" fill="#2b2116">기관실</text>
  <text x="805" y="290" text-anchor="middle" font-size="10" fill="#3a3020" font-style="italic">engine room</text>

  <!-- doors between deck/lounge/cabin/galley/engine_room -->
  <line x1="300" y1="160" x2="300" y2="205" stroke="#2b2116" stroke-width="4"/>
  <line x1="300" y1="265" x2="300" y2="310" stroke="#2b2116" stroke-width="4"/>
  <line x1="450" y1="160" x2="450" y2="205" stroke="#2b2116" stroke-width="4"/>
  <line x1="450" y1="265" x2="450" y2="310" stroke="#2b2116" stroke-width="4"/>
  <line x1="600" y1="160" x2="600" y2="205" stroke="#2b2116" stroke-width="4"/>
  <line x1="600" y1="265" x2="600" y2="310" stroke="#2b2116" stroke-width="4"/>
  <line x1="750" y1="160" x2="750" y2="205" stroke="#2b2116" stroke-width="4"/>
  <line x1="750" y1="265" x2="750" y2="310" stroke="#2b2116" stroke-width="4"/>

  <!-- stern -->
  <line x1="860" y1="160" x2="860" y2="310" stroke="#2b2116" stroke-width="4"/>
</svg>
